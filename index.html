<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>캐릭터의 모든 것! DB 메인사이트</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-logo">
      <img src="svg/logo.png" alt="로고" />
    </div>
    <div class="dark-mode-toggle">
      <input type="checkbox" id="darkModeToggle" aria-label="다크 모드 켜기/끄기">
      <label for="darkModeToggle" class="slider"></label>
    </div>
    <button class="hamburger" id="hamburgerBtn" aria-label="메뉴 열기/닫기"></button>
    <ul class="navbar-menu" id="navbarMenu">
      <li><a href="damage" target="_blank">데미지 계산기</a></li>
      <li><a href="characters" target="_blank">캐릭터DB</a></li>
      <li><a href="https://cats2352.github.io/OPTC-item/" target="_blank">아이템DB</a></li>
      <li><a href="https://hayaden.github.io/optc-ships/" target="_blank">선박 DB</a></li>
      <li><a href="title23/title.html" target="_blank">칭호 DB</a></li>
      <li><a href="https://gall.dcinside.com/mgallery/board/lists/?id=onepiecetc" target="_blank">원트크 갤러리</a></li>
      <li><a href="https://cafe.naver.com/bneoptc" target="_blank">네이버 공식카페</a></li>
    </ul>
  </nav>

  <main class="main-section">
    <h1 class="main-title">
      <span class="gradient-text">캐릭터 데이터의 전부</span>
    </h1>
    <p class="main-subtitle">빠르고 간편하게</p>
    <p class="sub-desc">4000개가 넘는 캐릭터의 정보<br>정확하고 빠르게 찾아보세요!</p>
  </main>

  <div class="carousel-top-btns">
    <a href="characters" class="carousel-btn-link">캐릭터 DB 바로가기</a>
    <a href="https://cats2352.github.io/OPTC-item/" class="carousel-btn-link">아이템DB 바로가기</a>
  </div>

  <div class="carousel-container">
    <div class="carousel-slides">
      <div class="carousel-slide">
        <picture>
          <source media="(max-width: 600px)" srcset="svg/9월25일오로성600.png">
          <img src="svg/9월25일오로성1200.png" alt="슬라이드 1 이미지">
        </picture>
      </div>
      <div class="carousel-slide">
        <picture>
          <source media="(max-width: 600px)" srcset="svg/공지사항600.png">
          <img src="svg/공지사항1200.png" alt="슬라이드 2 이미지">
        </picture>
      </div>
    </div>
    <button class="carousel-btn prev-btn" aria-label="이전 슬라이드">&#10094;</button>
    <button class="carousel-btn next-btn" aria-label="다음 슬라이드">&#10095;</button>
    <div class="carousel-dots"></div>
  </div>
  <script>
    // ===== 다크 모드 로직 (기존과 동일) =====
    const darkModeToggle = document.getElementById('darkModeToggle');
    const body = document.body;
    if (localStorage.getItem('theme') === 'dark') {
      body.classList.add('dark-mode');
      darkModeToggle.checked = true;
    }
    darkModeToggle.addEventListener('change', () => {
      if (darkModeToggle.checked) {
        body.classList.add('dark-mode');
        localStorage.setItem('theme', 'dark');
      } else {
        body.classList.remove('dark-mode');
        localStorage.setItem('theme', 'light');
      }
    });

    // ===== 햄버거 메뉴 로직 (기존과 동일) =====
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const navbarMenu = document.getElementById('navbarMenu');
    let menuOpen = false;
    function updateHamburgerIcon() {
      if (menuOpen) {
        hamburgerBtn.style.backgroundImage = "url('svg/X.svg')";
      } else {
        hamburgerBtn.style.backgroundImage = "url('svg/ham.svg')";
      }
    }
    hamburgerBtn.addEventListener('click', function() {
      menuOpen = !menuOpen;
      navbarMenu.classList.toggle('active', menuOpen);
      updateHamburgerIcon();
    });
    updateHamburgerIcon();

    // ===== 캐러셀 슬라이드 로직 (기존과 동일) =====
    const slidesContainer = document.querySelector('.carousel-slides');
    const slides = document.querySelectorAll('.carousel-slide');
    const prevBtn = document.querySelector('.prev-btn');
    const nextBtn = document.querySelector('.next-btn');
    const dotsContainer = document.querySelector('.carousel-dots');

    let currentIndex = 0;
    let slideInterval;

    slides.forEach((_, i) => {
      const dot = document.createElement('button');
      dot.classList.add('dot');
      dot.setAttribute('aria-label', `슬라이드 ${i + 1}로 이동`);
      dot.addEventListener('click', () => {
        goToSlide(i);
        resetInterval();
      });
      dotsContainer.appendChild(dot);
    });

    const dots = document.querySelectorAll('.dot');

    function goToSlide(index) {
      if (index < 0) {
        index = slides.length - 1;
      } else if (index >= slides.length) {
        index = 0;
      }
      
      slidesContainer.style.transform = `translateX(-${index * 100}%)`;
      currentIndex = index;
      updateDots();
    }

    function updateDots() {
      dots.forEach((dot, i) => {
        if (i === currentIndex) {
          dot.classList.add('active');
        } else {
          dot.classList.remove('active');
        }
      });
    }

    function startInterval() {
      slideInterval = setInterval(() => {
        goToSlide(currentIndex + 1);
      }, 4000);
    }

    function resetInterval() {
      clearInterval(slideInterval);
      startInterval();
    }

    nextBtn.addEventListener('click', () => {
      goToSlide(currentIndex + 1);
      resetInterval();
    });

    prevBtn.addEventListener('click', () => {
      goToSlide(currentIndex - 1);
      resetInterval();
    });

    goToSlide(0);
    startInterval();
  </script>
</body>
</html>
