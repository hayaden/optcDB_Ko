<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>캐릭터의 모든 것! DB 메인사이트</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-logo">
      <img src="svg/logo.png" alt="로고" />
    </div>
    <div class="dark-mode-toggle">
      <input type="checkbox" id="darkModeToggle" aria-label="다크 모드 켜기/끄기">
      <label for="darkModeToggle" class="slider"></label>
    </div>
    <button class="hamburger" id="hamburgerBtn" aria-label="메뉴 열기/닫기"></button>
    <ul class="navbar-menu" id="navbarMenu">
      <li><a href="damage" target="_blank">데미지 계산기</a></li>
      <li><a href="characters" target="_blank">캐릭터DB</a></li>
      <li><a href="https://cats2352.github.io/OPTC-item/" target="_blank">아이템DB</a></li>
      <li><a href="https://hayaden.github.io/optc-ships/" target="_blank">선박 DB</a></li>
      <li><a href="title23/title.html" target="_blank">칭호 DB</a></li>
      <li><a href="https://gall.dcinside.com/mgallery/board/lists/?id=onepiecetc" target="_blank">원트크 갤러리</a></li>
      <li><a href="https://cafe.naver.com/bneoptc" target="_blank">네이버 공식카페</a></li>
    </ul>
  </nav>
  <main class="main-section">
    <h1 class="main-title">
      <span class="gradient-text">캐릭터 데이터의 전부</span>
    </h1>
    <p class="main-subtitle">빠르고 간편하게</p>
    <p class="sub-desc">4000개가 넘는 캐릭터의 정보<br>정확하고 빠르게 찾아보세요!</p>
  </main>
  <div class="carousel-top-btns">
    <a href="characters" class="carousel-btn-link">캐릭터 DB 바로가기</a>
    <a href="https://cats2352.github.io/OPTC-item/" class="carousel-btn-link">아이템DB 바로가기</a>
  </div>

  <section class="carousel-section">
    <div class="carousel-track">
      <div class="carousel-slide active">
        <a href="characters">
          <picture>
            <source media="(max-width: 600px)" srcset="./svg/9월25일오로성600.png">
            <img src="./svg/9월 25일 오로성 1200.png" alt="이미지1" />
          </picture>
        </a>
      </div>
      <div class="carousel-slide">
        <picture>
          <source media="(max-width: 600px)" srcset="./svg/공지사항600.png">
          <img src="./svg/공지사항1200.png" alt="이미지2" />
        </picture>
      </div>
      </div>
    <button class="carousel-btn prev" aria-label="이전 이미지">&#10094;</button>
    <button class="carousel-btn next" aria-label="다음 이미지">&#10095;</button>

    <div class="carousel-indicators"></div>
  </section>
<script>
    // ===== 다크 모드 로직 (기존과 동일) =====
    const darkModeToggle = document.getElementById('darkModeToggle');
    const body = document.body;
    if (localStorage.getItem('theme') === 'dark') {
      body.classList.add('dark-mode');
      darkModeToggle.checked = true;
    }
    darkModeToggle.addEventListener('change', () => {
      if (darkModeToggle.checked) {
        body.classList.add('dark-mode');
        localStorage.setItem('theme', 'dark');
      } else {
        body.classList.remove('dark-mode');
        localStorage.setItem('theme', 'light');
      }
    });

    // ===== 햄버거 메뉴 로직 (기존과 동일) =====
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const navbarMenu = document.getElementById('navbarMenu');
    let menuOpen = false;
    function updateHamburgerIcon() {
      if (menuOpen) {
        hamburgerBtn.style.backgroundImage = "url('svg/X.svg')";
      } else {
        hamburgerBtn.style.backgroundImage = "url('svg/ham.svg')";
      }
    }
    hamburgerBtn.addEventListener('click', function() {
      menuOpen = !menuOpen;
      navbarMenu.classList.toggle('active', menuOpen);
      updateHamburgerIcon();
    });
    updateHamburgerIcon();

    // ===== 케러셀(슬라이더) 동작 (수정된 최종안) =====
    const track = document.querySelector('.carousel-track');
    const slides = Array.from(track.children);
    const nextButton = document.querySelector('.carousel-btn.next');
    const prevButton = document.querySelector('.carousel-btn.prev');
    const indicatorsContainer = document.querySelector('.carousel-indicators');
    
    // 슬라이드가 없으면 스크립트 실행 중단
    if (slides.length > 0) {
      
      // --- 바로 이 부분이 핵심 수정사항입니다 ---
      // 너비를 한 번만 정확하게 계산해서 모든 슬라이드에 동일하게 적용합니다.
      const setupSlides = () => {
        const slideWidth = slides[0].getBoundingClientRect().width;
        slides.forEach((slide, index) => {
          slide.style.left = slideWidth * index + 'px';
        });
      };
      // ------------------------------------

      // 인디케이터(점) 생성
      slides.forEach((_, index) => {
        const dot = document.createElement('button');
        dot.classList.add('indicator-dot');
        if (index === 0) dot.classList.add('active');
        indicatorsContainer.appendChild(dot);
      });
      const indicators = Array.from(indicatorsContainer.children);

      // 슬라이드 이동 및 인디케이터 업데이트 함수
      const moveToSlide = (targetSlide) => {
        const currentSlide = track.querySelector('.active');
        const currentDot = indicatorsContainer.querySelector('.active');
        const targetIndex = slides.findIndex(slide => slide === targetSlide);
        const targetDot = indicators[targetIndex];

        track.style.transform = 'translateX(-' + targetSlide.style.left + ')';
        currentSlide.classList.remove('active');
        targetSlide.classList.add('active');
        
        currentDot.classList.remove('active');
        targetDot.classList.add('active');
      }

      // 이전/다음 버튼 클릭 이벤트
      prevButton.addEventListener('click', e => {
        const currentSlide = track.querySelector('.active');
        const prevSlide = currentSlide.previousElementSibling || slides[slides.length - 1];
        moveToSlide(prevSlide);
      });

      nextButton.addEventListener('click', e => {
        const currentSlide = track.querySelector('.active');
        const nextSlide = currentSlide.nextElementSibling || slides[0];
        moveToSlide(nextSlide);
      });

      // 인디케이터 클릭 이벤트
      indicatorsContainer.addEventListener('click', e => {
        const targetDot = e.target.closest('.indicator-dot');
        if (!targetDot) return;
        const targetIndex = indicators.findIndex(dot => dot === targetDot);
        const targetSlide = slides[targetIndex];
        moveToSlide(targetSlide);
      });
      
      // 창 크기 변경 시 슬라이드 위치 재계산
      window.addEventListener('resize', () => {
        setupSlides();
        const currentActiveSlide = track.querySelector('.active');
        track.style.transform = 'translateX(-' + currentActiveSlide.style.left + ')';
      });

      // 터치 스와이프
      let touchStartX = 0;
      track.addEventListener('touchstart', e => {
          touchStartX = e.touches[0].clientX;
      });
      track.addEventListener('touchend', e => {
          const touchEndX = e.changedTouches[0].clientX;
          if (touchStartX - touchEndX > 50) {
              nextButton.click();
          } else if (touchEndX - touchStartX > 50) {
              prevButton.click();
          }
      });

      // 초기 슬라이드 위치 설정
      setupSlides();
    }
  </script>
</body>
</html>
